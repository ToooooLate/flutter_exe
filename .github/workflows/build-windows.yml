name: Build Windows Desktop App

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    # Flutter 3.32.2 supports VS 2022; windows-latest now uses VS 2026.
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Read fixed WebView2 cache metadata
      id: webview2
      shell: powershell
      run: |
        $runtime = Get-Content -LiteralPath 'desktop/scripts/webview2-runtime.json' -Raw | ConvertFrom-Json
        @(
          "version=$($runtime.version)"
          "architecture=$($runtime.architecture)"
          "sha256=$($runtime.sha256)"
        ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Restore fixed WebView2 CAB
      id: webview2-cache
      uses: actions/cache/restore@v4
      with:
        path: desktop/.webview2/WebView2-${{ steps.webview2.outputs.version }}-${{ steps.webview2.outputs.architecture }}.cab
        key: ${{ runner.os }}-webview2-cab-v1-${{ steps.webview2.outputs.version }}-${{ steps.webview2.outputs.architecture }}-${{ steps.webview2.outputs.sha256 }}

    - name: Prepare fixed WebView2 runtime
      shell: pwsh
      run: ./desktop/scripts/prepare-webview2.ps1

    - name: Save verified WebView2 CAB
      if: steps.webview2-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: desktop/.webview2/WebView2-${{ steps.webview2.outputs.version }}-${{ steps.webview2.outputs.architecture }}.cab
        key: ${{ steps.webview2-cache.outputs.cache-primary-key }}

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.2'
        channel: 'stable'
        
    - name: Build Windows app with fixed WebView2
      shell: powershell
      run: ./desktop/scripts/build-release.ps1 -SkipRuntimePreparation

    - name: Upload Windows build artifact
      uses: actions/upload-artifact@v4
      with:
        name: qingzhi-desktop-windows
        path: desktop/releases/*.zip
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
